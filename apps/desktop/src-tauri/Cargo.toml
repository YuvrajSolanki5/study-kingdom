[package]
name = "study-kingdom"
version = "0.1.0"
description = "Study Kingdom for macOS"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "study_kingdom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray"] }
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }
core-foundation = "0.10.1"
security-framework = "3.7.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
