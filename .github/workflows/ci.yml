name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run econ:sim
      - run: npm run balance:combat
      - name: Encrypted backup recovery drill
        run: npm run test:backup
        env:
          PGTOOLS_CONTAINER: ${{ job.services.postgres.id }}
      - name: Combat verification benchmark (report only)
        run: npm run bench:sim

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # supabase start reads the generated (gitignored) Edge Function bundle.
      - run: node scripts/build-edge.mjs
      - run: npx supabase start
      - run: node scripts/prepare-ci.mjs
      - name: Start local verification function
        run: npx supabase functions serve verify-battle --env-file supabase/functions/.env --no-verify-jwt > /tmp/sk-edge.log 2>&1 &
      - run: node scripts/test-edge.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
      - run: npx supabase stop --no-backup
        if: always()

  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
