# Local development stack (`npm run db:start`). Production auth settings,
# Username accounts use non-deliverable internal aliases; no SMTP is needed.
# (Supabase Management API) so secrets never live in this file.
project_id = "study-kingdom"

[api]
enabled = true
port = 54321
# Game tables live in the private `game` schema, which is deliberately not exposed.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54328
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Mailpit captures every email locally: http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10
password_requirements = ""

[auth.rate_limit]
email_sent = 0
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# Trusted beta accounts sign in immediately without collecting email.
enable_confirmations = false
secure_password_change = false
max_frequency = "5s"
otp_length = 6
otp_expiry = 3600

[auth.email.notification.password_changed]
enabled = false

[auth.sms]
enable_signup = false

[auth.mfa]
max_enrolled_factors = 10

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false
port = 54327
backend = "postgres"

# Called by the Worker with an HMAC signature, not a user JWT.
[functions.verify-battle]
verify_jwt = false
